name: Build Self-Contained FlyleafPlayer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Preuzmi Flyleaf izvorni kod
      uses: actions/checkout@v4
      with:
        repository: SuRGeoNix/Flyleaf
        submodules: recursive

    - name: Postavi .NET 10 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Izgradi Self-Contained Portable EXE
      run: |
        dotnet publish Samples/FlyleafPlayer/FlyleafPlayer.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o ./output

    - name: Zapakiraj gotov program
      uses: actions/upload-artifact@v4
      with:
        name: FlyleafPlayer-SelfContained-x64
        path: ./output

